providers:
  opencode:
    primary: mimo-v2.5-free
    fallback: mimo-v2.5-free
    base_url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_API_KEY
    reasoning_effort: max

rate_limits:
  global:
    requests_per_minute: 35
    window_seconds: 60
  per_job:
    requests_per_minute: 30
    window_seconds: 60

cache:
  database_path: storage/cache.db
  enabled: true
